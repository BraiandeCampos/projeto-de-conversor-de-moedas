<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Convert Currency</title>
</head>

<body>
    <img src="./assets/logo.gif" alt="Logo" class="logo">
    <main>
        <label>
            Converter <b>de</b>
            <select class="select-currency-to-convert">
                <option value="real">
                    R$ Real brasileiro
                </option>
                <option value="dolar"  >
                    US$ Dollar americano
                </option>
                <option value="euro">
                    € Euro
                </option>
                <option value="libra">
                    £ Libra
                </option>
                <option value="bitcoin">
                    ₿ Bitcoin
                </option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="select-currency-converted">
                <option value="dolar">
                    US$ Dollar americano
                </option>
                <option value="euro">
                    € Euro
                </option>
                <option value="libra">
                    £ Libra
                </option>
                <option value="bitcoin">
                    ₿ Bitcoin
                </option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" placeholder="R$ 10.000">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/brasil.png" alt="moeda a convereter" class="currency-image-to-convert">
                <p class="currency-name-to-convert">real</p>
                <p class="currency-value-to-convert">R$ 0</p>
            </div>

            <img src="./assets/arrow.png" alt="seta" class="arrow-img">

            <div class="currency-box">
                <img class="currency-image" src="./assets/estadosunidos.png" alt="moeda a converter">
                <p class="currency-converted-name">dólar americano</p>
                <p class="currency-value-converted">US$ 0</p>
            </div>

        </section>


    </main>
</body>
<script src="./script.js"></script>

</html>
